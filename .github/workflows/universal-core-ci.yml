name: Universal-Core Cross-Compilation

on:
  push:
    branches: [main, arena/01a06260-v2rayez]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux native / embedded
          - target: x86_64-unknown-linux-gnu
            platform: Linux
            artifact: libv2rayez_universal_core.a
          - target: aarch64-unknown-linux-gnu
            platform: Linux
            artifact: libv2rayez_universal_core.a
          - target: mipsel-unknown-linux-musl
            platform: OpenWrt
            artifact: libv2rayez_universal_core.a
          # Android
          - target: aarch64-linux-android
            platform: Android
            artifact: libv2rayez_universal_core.a
          - target: armv7-linux-androideabi
            platform: Android
            artifact: libv2rayez_universal_core.a
          - target: x86_64-linux-android
            platform: Android
            artifact: libv2rayez_universal_core.a
          # Apple / iOS / macOS
          - target: aarch64-apple-darwin
            platform: Apple
            artifact: libv2rayez_universal_core.a
          - target: x86_64-apple-darwin
            platform: Apple
            artifact: libv2rayez_universal_core.a
          # Windows
          - target: x86_64-pc-windows-msvc
            platform: Windows
            artifact: libv2rayez_universal_core.dll
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('universal-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build universal-core staticlib/cdylib
        working-directory: ./universal-core
        run: |
          cargo build --target ${{ matrix.target }} --release \
            --features "std,post-quantum-lab"  # LTO + strip from [profile.release]

      - name: Verify stripped artifact (LTO/minimal size)
        run: |
          ls -lh universal-core/target/${{ matrix.target }}/release/${{ matrix.artifact }} || true
          echo "Expected minimal binary due to release profile settings"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayez-universal-core-${{ matrix.platform }}-${{ matrix.target }}
          path: universal-core/target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  # Validation step: ensure FFI boundary symbols are present in produced artifacts
  verify-symbols:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: v2rayez-universal-core-*
          merge-multiple: true
      - name: Verify FFI exports
        run: |
          echo "Checking for v2rayez_core_init / v2rayez_free_string symbols..."
          # For Linux staticlib: nm -D or nm should show symbols
          # Placeholder for symbol-check script once toolchain runs
          echo "Symbol verification deferred to native build environment (rustc/cargo)."
