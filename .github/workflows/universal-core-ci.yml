name: "Universal Core CI (Quality Gates)"

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE IS NO LONGER A SECOND RELEASE PIPELINE
# ─────────────────────────────────────────────────────────────────────────────
# This workflow used to be a byte-for-byte duplicate of `release.yml` (same
# `name:`, same jobs, same publishing logic). Because both files triggered on
# the same events, GitHub started TWO identical pipelines per push, and both
# raced to run `gh release create` / `gh release upload` against the SAME tag
# (`v2rayez-universal-latest`). Whichever run lost the race died with
# "Process completed with exit code 1" in the "Publish to GitHub Releases"
# step — which is exactly the recurring failure that kept appearing.
#
# Nothing was removed: `release.yml` remains the single, complete, fully
# automatic build + publish pipeline for every platform (Android, iOS,
# Windows, Linux, macOS, OpenWrt). This file now does the complementary work
# it was always meant to do — fast, cheap, fail-closed verification gates that
# run on every push and pull request BEFORE the heavy release matrix matters.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - master
      - 'arena/*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # GATE 1: WORKFLOW INTEGRITY — prevents the duplicate-publisher regression
  # ───────────────────────────────────────────────────────────────────────────
  workflow-integrity:
    name: Workflow integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          failed = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"OK   {path}")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Assert exactly one release publisher exists
        shell: bash
        run: |
          set -euo pipefail
          publishers=()
          for wf in .github/workflows/*.y*ml; do
            if grep -vE "^[[:space:]]*#" "$wf" | grep -qE "gh release (create|upload)"; then
              publishers+=("$wf")
            fi
          done
          echo "Workflows containing release-publishing logic: ${publishers[*]:-<none>}"
          if [[ "${#publishers[@]}" -gt 1 ]]; then
            echo "::error::More than one workflow publishes GitHub Releases: ${publishers[*]}." >&2
            echo "::error::Concurrent publishers race on the same tag and fail with exit code 1." >&2
            exit 1
          fi
          if [[ "${#publishers[@]}" -eq 0 ]]; then
            echo "::error::No release publisher found — release automation would be dead." >&2
            exit 1
          fi
          echo "Workflow integrity gate PASSED: single publisher = ${publishers[0]}"

      - name: Assert no duplicate workflow display names
        shell: bash
        run: |
          set -euo pipefail
          dupes="$(grep -h '^name:' .github/workflows/*.y*ml | sort | uniq -d || true)"
          if [[ -n "$dupes" ]]; then
            echo "::error::Duplicate workflow names detected (ambiguous in the Actions UI):" >&2
            echo "$dupes" >&2
            exit 1
          fi
          echo "All workflow display names are unique."

      - name: Assert no deprecated Node 20 action majors
        shell: bash
        run: |
          set -euo pipefail
          stale="$(grep -hoE 'actions/(checkout|upload-artifact|download-artifact)@v[0-9]+' .github/workflows/*.y*ml \
            | sort -u \
            | grep -E 'checkout@v[1-4]$|upload-artifact@v[1-4]$|download-artifact@v[1-5]$' || true)"
          if [[ -n "$stale" ]]; then
            echo "::error::Deprecated Node 20 action versions still referenced:" >&2
            echo "$stale" >&2
            exit 1
          fi
          echo "All first-party actions are on Node 24 capable majors."

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 2: SHELL SCRIPT SANITY — every build script must parse and be runnable
  # ───────────────────────────────────────────────────────────────────────────
  shell-gates:
    name: Shell script gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bash syntax check for all build scripts
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK   $script"
            else
              echo "::error::Syntax error in $script" >&2
              failed=$((failed + 1))
            fi
          done < <(find scripts universal-core/ci universal-core/openwrt -name '*.sh' -type f 2>/dev/null | sort)
          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} shell script(s) failed syntax validation." >&2
            exit 1
          fi

      - name: Ensure release scripts are executable-safe
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for required in \
            scripts/build-android-apk.sh \
            scripts/build-ios-ipa.sh \
            scripts/build-ios-xcframework.sh \
            scripts/build-openwrt-ipk.sh \
            scripts/build-release-artifacts.sh \
            scripts/generate-checksums.sh \
            scripts/manual-apk-fallback.sh \
            scripts/manual-ipk-fallback.sh \
            universal-core/ci/build-target.sh
          do
            if [[ ! -f "$required" ]]; then
              echo "::error::Required build script missing: $required" >&2
              missing=$((missing + 1))
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1
          echo "All required build scripts are present."

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 3: FEATURE / REQUIREMENT SELF-TESTS — every tools/*.mjs gate must pass
  # ───────────────────────────────────────────────────────────────────────────
  feature-gates:
    name: Feature & requirement gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run every V2RayEZ verification gate
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          passed=0
          for gate in tools/*.mjs; do
            [[ -f "$gate" ]] || continue
            printf '── %s\n' "$gate"
            if node "$gate"; then
              passed=$((passed + 1))
            else
              echo "::error::Gate failed: $gate" >&2
              failed+=("$gate")
            fi
          done
          echo
          echo "Gates passed: ${passed}"
          if [[ "${#failed[@]}" -gt 0 ]]; then
            echo "::error::${#failed[@]} gate(s) failed: ${failed[*]}" >&2
            exit 1
          fi
          echo "All V2RayEZ feature/requirement gates PASSED."

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 4: RUST CORE HEALTH — format, lint and unit-test the universal core
  # ───────────────────────────────────────────────────────────────────────────
  rust-core:
    name: Rust core check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            universal-core/target
          key: ubuntu-corecheck-${{ hashFiles('universal-core/Cargo.toml', 'universal-core/Cargo.lock') }}
          restore-keys: |
            ubuntu-corecheck-

      - name: cargo check (std,post-quantum-lab)
        working-directory: ./universal-core
        run: cargo check --release --features "std,post-quantum-lab" --all-targets

      # NOTE: tests run in the dev profile on purpose. The release profile sets
      # `panic = "abort"` + `lto = true`, which is correct for shipped artifacts
      # but breaks/distorts the libtest harness (it needs unwinding to report
      # assertion failures). Running tests unoptimized is both faster and
      # actually able to report which assertion failed.
      - name: cargo test (fail-closed)
        working-directory: ./universal-core
        run: |
          set -uo pipefail
          cargo test --features "std,post-quantum-lab" --all-targets --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
          status="${PIPESTATUS[0]}"

          # Always publish the outcome, especially on failure, so the exact
          # failing assertion is visible without downloading raw job logs.
          {
            echo "### Rust core tests"
            echo
            echo '```'
            grep -E "^test result:|^running [0-9]|^---- .* stdout ----|^thread .* panicked|^ *left:|^ *right:|assertion|^test .* FAILED|^error(\[|:)" /tmp/cargo-test.log | head -n 200 || true
            echo '```'
            echo
            if [[ "$status" -ne 0 ]]; then
              echo "#### Failed tests"
              echo '```'
              sed -n '/^failures:$/,/^test result:/p' /tmp/cargo-test.log | head -n 200 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Emit the failing tests as GitHub annotations. Step summaries and raw
          # logs are not always retrievable via the API, but annotations always
          # are - this guarantees the exact assertion is diagnosable.
          if [[ "$status" -ne 0 ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              echo "::error::${line}"
            done < <(grep -E "^thread .* panicked|^ *left:|^ *right:|assertion .* failed|^test .*FAILED|^error(\[|:)" /tmp/cargo-test.log | head -n 40)
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              echo "::error::FAILED TEST: ${line}"
            done < <(sed -n '/^failures:$/,/^test result:/p' /tmp/cargo-test.log | grep -E '^    ' | head -n 40)

            # Unconditional fallback: the tail of the log always contains the
            # real cause (compile error, panic, or harness failure).
            echo "::group::cargo test tail"
            tail -n 80 /tmp/cargo-test.log
            echo "::endgroup::"
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              echo "::error::${line}"
            done < <(tail -n 40 /tmp/cargo-test.log)
          fi

          exit "$status"

      - name: Report cargo test failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          body="$(printf '### cargo test failure (run %s)\n\n```\n%s\n```\n' \
            "$GITHUB_RUN_ID" "$(tail -n 120 /tmp/cargo-test.log 2>/dev/null || echo 'no log captured')")"
          jq -n --arg b "$body" '{body:$b}' > /tmp/comment.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --input /tmp/comment.json >/dev/null 2>&1 || true

      - name: Upload cargo test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cargo-test-log
          path: /tmp/cargo-test.log
          if-no-files-found: warn

      - name: cargo clippy (advisory)
        working-directory: ./universal-core
        run: cargo clippy --release --features "std,post-quantum-lab" -- -W clippy::all || echo "::warning::clippy emitted lints."

  # ───────────────────────────────────────────────────────────────────────────
  # SUMMARY: single required status for branch protection
  # ───────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI summary
    needs: [workflow-integrity, shell-gates, feature-gates, rust-core]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        shell: bash
        run: |
          set -euo pipefail
          integrity="${{ needs.workflow-integrity.result }}"
          shellr="${{ needs.shell-gates.result }}"
          features="${{ needs.feature-gates.result }}"
          rust="${{ needs.rust-core.result }}"

          {
            echo "## V2RayEZ Universal Core CI"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Workflow integrity | \`${integrity}\` |"
            echo "| Shell scripts | \`${shellr}\` |"
            echo "| Feature gates | \`${features}\` |"
            echo "| Rust core | \`${rust}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          for r in "$integrity" "$shellr" "$features" "$rust"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more CI gates did not succeed." >&2
              exit 1
            fi
          done
          echo "All CI gates succeeded."
