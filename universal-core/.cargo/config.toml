# Do not set [build].target — a host default of x86_64-unknown-linux-gnu would
# produce glibc objects when Android Bionic (NDK clang) is intended.
# CI always passes --target via ci/build-target.sh.

[target.x86_64-unknown-linux-gnu]
linker = "gcc"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi24-clang"
ar = "llvm-ar"

[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"
ar = "llvm-ar"

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang"
ar = "llvm-ar"

[target.aarch64-apple-darwin]
linker = "clang"

[target.x86_64-apple-darwin]
linker = "clang"

[target.x86_64-pc-windows-msvc]
linker = "link"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.mipsel-unknown-linux-musl]
linker = "mipsel-linux-gnu-gcc"

[target.mipsel-unknown-linux-gnu]
linker = "mipsel-linux-gnu-gcc"

[target.armv7-unknown-linux-musleabihf]
linker = "arm-openwrt-linux-musleabihf-gcc"
