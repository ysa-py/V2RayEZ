[package]
name = "v2rayez-universal-core"
version = "0.1.0"
edition = "2021"
license = "SEE LICENSE IN ../LICENSE"
description = "Canonical shared core API layer for V2RayEZ Universal"

[lib]
name = "v2rayez_universal_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["std"]
std = []
post-quantum-lab = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rand_core = "0.6"
