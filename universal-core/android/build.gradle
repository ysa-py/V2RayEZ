// Top-level build file for V2RayEZ Universal Core Android wrapper
// Produces .apk with multi-ABI support (arm64-v8a, armeabi-v7a, x86_64)

plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

// Gradle 8+: `rootProject.buildDir` is deprecated (emits a deprecation
// warning); the build-directory location is provided by `layout` instead.
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
