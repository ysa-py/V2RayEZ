name: Windows and Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem -Path @(
            (Join-Path $env:ANDROID_HOME 'cmdline-tools'),
            (Join-Path $env:ANDROID_SDK_ROOT 'cmdline-tools')
          ) -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkManager) { throw 'Android sdkmanager.bat was not found on the hosted runner.' }
          & $sdkManager 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
      - name: Fetch and verify Aether core
        run: npm run fetch:core
      - name: Fetch and verify routing engine
        run: npm run fetch:routing
      - name: Test frontend
        run: npm test
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build application and installers
        run: npm run build

      - name: Fetch verified Android native assets
        run: npm run fetch:android

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force android/.android-signing | Out-Null
          [IO.File]::WriteAllBytes("android/.android-signing/v2rayez-gui.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed Android APKs
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/v2rayez-gui.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-Location android
          ./gradlew.bat assembleRelease bundleRelease lintRelease

      - name: Validate Android pull request build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Set-Location android
          ./gradlew.bat assembleDebug lintDebug

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe "release/V2RayEZ-VPN-v${version}-Windows-x64-Installer.exe"
          Copy-Item src-tauri/target/release/bundle/msi/*.msi "release/V2RayEZ-VPN-v${version}-Windows-x64.msi"
          Copy-Item src-tauri/target/release/v2rayez-gui.exe "portable/V2RayEZ.exe"
          Copy-Item src-tauri/binaries/aether-x86_64-pc-windows-msvc.exe portable/aether.exe
          Copy-Item src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe portable/sing-box.exe
          Copy-Item LICENSE,NOTICE.md,TRADEMARK.md,third-party/sing-box-LICENSE.txt portable/
          Compress-Archive -Path portable/* -DestinationPath "release/V2RayEZ-VPN-v${version}-Windows-x64-portable.zip"
          Copy-Item android/app/build/outputs/apk/release/app-universal-release.apk "release/V2RayEZ-VPN-v${version}-Android-Universal.apk"
          Copy-Item android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release/V2RayEZ-VPN-v${version}-Android-ARMv7.apk"
          Copy-Item android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "release/V2RayEZ-VPN-v${version}-Android-ARM64.apk"
          Copy-Item android/app/build/outputs/apk/release/app-x86_64-release.apk "release/V2RayEZ-VPN-v${version}-Android-x86_64.apk"
          Copy-Item android/app/build/outputs/bundle/release/app-release.aab "release/V2RayEZ-VPN-v${version}-Android-AAB.aab"
          Get-ChildItem release -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }
          $bundle = "release/V2RayEZ-VPN-v${version}-all-platforms.zip"
          Compress-Archive -Path (Get-ChildItem release -File | Select-Object -ExpandProperty FullName) -DestinationPath $bundle
          $bundleHash = Get-FileHash $bundle -Algorithm SHA256
          "$($bundleHash.Hash.ToLower())  $([System.IO.Path]::GetFileName($bundle))" | Add-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: V2RayEZ-Windows-Android
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            # V2RayEZ v2.0.0

            This is a major new generation release of V2RayEZ.

            - New UI experience
            - Aether Core upgraded to v1.7.0
            - Improved VPN stability and performance
            - Improved Split Tunneling
            - Improved update system
            - Better connection experience

            The bundled Aether Core and sing-box routing engine are fetched from official releases and SHA-256 verified during the build.
            Windows 10/11 x64 and Android 8.0+ are supported. Windows binaries are unsigned and may trigger a SmartScreen warning; Android APKs are release-signed.
